<!doctype html>
<html lang="{{ transaction.language }}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ t.title }}</title>
<link rel="stylesheet" href="/checkout-assets/tokens.css">
<link rel="stylesheet" href="/checkout-assets/widget.css">
</head>
<body>
<div class="widget">
  <div class="summary">
    <span class="merchant">{{ merchant.name }}</span>
    <span class="amount">{{ '%.2f'|format(transaction.amount) }} {{ transaction.currency }}</span>
  </div>

  <form method="post" action="/checkout/{{ transaction.checkout_token }}/widget">
    <label class="test-card">
      <span>{{ t.walletCard }}</span>
      <select name="card_number">
        {% for card in cards %}
        <option value="{{ card.number }}">{{ card.outcome }}</option>
        {% endfor %}
      </select>
    </label>

    <button type="submit" name="wallet" value="Apple Pay" class="wallet apple">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M17.05 12.54c-.02-2.05 1.68-3.03 1.75-3.08-.95-1.4-2.44-1.59-2.97-1.61-1.27-.13-2.47.74-3.11.74-.64 0-1.63-.72-2.68-.7-1.38.02-2.65.8-3.36 2.03-1.43 2.49-.37 6.18 1.03 8.2.68.99 1.5 2.1 2.57 2.06 1.03-.04 1.42-.67 2.67-.67s1.6.67 2.69.65c1.11-.02 1.81-1.01 2.49-2 .78-1.15 1.11-2.26 1.13-2.32-.03-.01-2.17-.83-2.19-3.3zM15.1 5.82c.56-.69.94-1.63.84-2.58-.81.03-1.8.54-2.38 1.22-.52.6-.98 1.57-.86 2.49.91.07 1.83-.46 2.4-1.13z"/></svg>
      {{ t.applePay }}
    </button>

    <button type="submit" name="wallet" value="Google Pay" class="wallet google">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12.24 10.29v3.6h5.03c-.22 1.29-1.61 3.79-5.03 3.79-3.03 0-5.5-2.51-5.5-5.6s2.47-5.6 5.5-5.6c1.72 0 2.88.73 3.54 1.37l2.41-2.32C16.63 3.9 14.63 3 12.24 3 7.44 3 3.56 6.88 3.56 11.68s3.88 8.68 8.68 8.68c5.01 0 8.33-3.52 8.33-8.48 0-.57-.06-1.01-.14-1.44h-8.19z"/></svg>
      {{ t.googlePay }}
    </button>
  </form>

  <p class="note">{{ t.walletNote }}</p>
</div>
</body>
</html>
