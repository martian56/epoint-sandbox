name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: epoint
          POSTGRES_PASSWORD: epoint
          POSTGRES_DB: epoint_sandbox
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U epoint"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run mypy src
      - run: uv run pytest --cov --cov-report=term-missing
      - name: Migrations apply cleanly
        run: uv run alembic upgrade head
        env:
          EPOINT_DATABASE_URL: postgresql+psycopg://epoint:epoint@localhost:5432/epoint_sandbox

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bunx biome ci .
      - run: bun run --cwd apps/web typecheck
      - run: bun run --cwd apps/web test
      - run: bun run --cwd apps/web build

  image:
    runs-on: ubuntu-latest
    needs: [api, web]
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: false
          load: true
          tags: epoint-sandbox:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Container serves the API
        run: |
          docker run -d --name sandbox -p 8181:8181 epoint-sandbox:ci
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8181/api/heartbeat > /dev/null; then
              echo "sandbox is up"
              exit 0
            fi
            sleep 2
          done
          echo "sandbox did not become healthy"
          docker logs sandbox
          exit 1
