<!doctype html>
<html lang="{{ transaction.language }}">

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ t.title }}</title>
<link rel="icon" type="image/x-icon" href="/checkout-assets/favicon.ico">
<link rel="stylesheet" href="/checkout-assets/tokens.css">
<link rel="stylesheet" href="/checkout-assets/checkout.css">
</head>
<body>

<footer>

  <nav><a href="/">Dashboard</a><a href="/docs">API reference</a></nav>

</html>
